name: Release MAAP OGC application packages

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: maap-ogc-production
  cancel-in-progress: false

env:
  MAAP_OGC_PROCESSES_URL: https://api.maap-project.org/api/ogc/processes

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: astral-sh/setup-uv@v7

      - name: Validate release metadata and CWL
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$version"
          grep -Fx "version = \"$version\"" pyproject.toml
          for mode in staged fetch; do
            workflow="dps/$mode/esa-biomass-gamma0-$mode.cwl"
            grep -Fqx "s:softwareVersion: $version # x-release-please-version" "$workflow"
            grep -Fqx "s:version: $version # x-release-please-version" "$workflow"
            grep -Fqx "        dockerPull: ghcr.io/${GITHUB_REPOSITORY,,}-$mode:$RELEASE_TAG # x-release-please-version" "$workflow"
            uvx --from cwltool cwltool --validate "$workflow"
            uvx --with pyyaml --from ogc-ap-validator ap-validator --detail errors "$workflow"
          done
          uv run --frozen --group dev pytest

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - mode: staged
            include_fetch: "false"
          - mode: fetch
            include_fetch: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: INCLUDE_FETCH=${{ matrix.include_fetch }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.mode }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.mode }}:${{ steps.revision.outputs.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Register or update MAAP processes
        env:
          MAAP_TOKEN: ${{ secrets.MAAP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MAAP_TOKEN"
          commit_sha="$(git rev-parse HEAD)"
          responses="$(mktemp -d)"
          trap 'rm -rf "$responses"' EXIT

          deploy() {
            local workflow="$1"
            local response="$responses/$(basename "$workflow").json"
            local workflow_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$commit_sha/$workflow"
            local payload
            local process_id
            local status

            payload="{\"executionUnit\":{\"href\":\"$workflow_url\"}}"
            status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              --request POST \
              --header "Content-Type: application/json" \
              --header "proxy-ticket: $MAAP_TOKEN" \
              --data "$payload" \
              "$MAAP_OGC_PROCESSES_URL")"

            if [ "$status" = "409" ]; then
              process_id="$(jq --exit-status --raw-output '.additionalProperties.processID' "$response")"
              curl --fail-with-body --silent --show-error \
                --request PUT \
                --header "Content-Type: application/json" \
                --header "proxy-ticket: $MAAP_TOKEN" \
                --data "$payload" \
                "$MAAP_OGC_PROCESSES_URL/$process_id" >/dev/null
            elif [ "$status" != "200" ] && [ "$status" != "201" ] && [ "$status" != "202" ]; then
              echo "MAAP registration failed for $workflow with HTTP $status" >&2
              return 1
            fi
          }

          deploy dps/staged/esa-biomass-gamma0-staged.cwl
          deploy dps/fetch/esa-biomass-gamma0-fetch.cwl
