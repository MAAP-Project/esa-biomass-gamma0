name: Release MAAP OGC application packages

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: maap-ogc-production
  cancel-in-progress: false

env:
  MAAP_OGC_PROCESSES_URL: https://api.maap-project.org/api/ogc/processes
  MAAP_OGC_DEPLOYMENT_JOBS_URL: https://api.maap-project.org/api/ogc/deploymentJobs

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.*"
          enable-cache: false

      - name: Validate release metadata and CWL
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$version"
          grep -Fx "version = \"$version\"" pyproject.toml
          for mode in staged fetch; do
            workflow="dps/$mode/esa-biomass-gamma0-$mode.cwl"
            grep -Fqx "s:softwareVersion: $version" "$workflow"
            grep -Fqx "s:version: $version" "$workflow"
            grep -Fqx "        dockerPull: ghcr.io/${GITHUB_REPOSITORY,,}-$mode:$RELEASE_TAG" "$workflow"
            uvx --from cwltool cwltool --validate "$workflow"
            uvx --with pyyaml --from ogc-ap-validator ap-validator --detail errors "$workflow"
          done
          uv run --frozen --group dev pytest

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - mode: staged
            include_fetch: "false"
          - mode: fetch
            include_fetch: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set image prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          push: true
          build-args: INCLUDE_FETCH=${{ matrix.include_fetch }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.mode }}:${{ github.event.release.tag_name }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.mode }}:${{ steps.revision.outputs.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Register or update MAAP processes
        env:
          MAAP_TOKEN: ${{ secrets.MAAP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$MAAP_TOKEN"
          commit_sha="$(git rev-parse HEAD)"
          responses="$(mktemp -d)"
          trap 'rm -rf "$responses"' EXIT

          log_response() {
            local workflow="$1"
            local action="$2"
            local status="$3"
            local response="$4"
            local process_id
            local pipeline_link

            process_id="$(jq --raw-output '.processID // .additionalProperties.processID // .id // empty' "$response" 2>/dev/null || true)"
            pipeline_link="$(jq --raw-output '.processPipelineLink.href // empty' "$response" 2>/dev/null || true)"

            printf 'MAAP %s %s: HTTP %s' "$workflow" "$action" "$status"
            [ -z "$process_id" ] || printf ', process ID %s' "$process_id"
            [ -z "$pipeline_link" ] || printf ', pipeline %s' "$pipeline_link"
            printf '\n'

            {
              printf '### MAAP registration: `%s`\n\n' "$workflow"
              printf -- '- Action: %s\n- HTTP status: %s\n' "$action" "$status"
              [ -z "$process_id" ] || printf -- '- Process ID: `%s`\n' "$process_id"
              [ -z "$pipeline_link" ] || printf -- '- Pipeline: %s\n' "$pipeline_link"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          monitor_deployments() {
            local workflow
            local response
            local headers
            local deployment_url
            local deployment_status
            local status_response
            local deadline=$((SECONDS + 1800))
            local -a pending_workflows=("$@")
            local -a next_pending_workflows
            declare -A deployment_urls

            for workflow in "${pending_workflows[@]}"; do
              response="$responses/$(basename "$workflow").json"
              headers="$responses/$(basename "$workflow").headers"
              deployment_url="$(jq --raw-output '
                (
                  .links[]?
                  | select(.rel == "monitor" and .type == "application/json")
                  | .href
                ) //
                .deploymentJobLink.href //
                .additionalProperties.deploymentJobLink.href //
                empty
              ' "$response")"
              if [ -z "$deployment_url" ]; then
                deployment_url="$(awk 'BEGIN { IGNORECASE = 1 } /^location:/ { sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit }' "$headers")"
              fi
              if [ -z "$deployment_url" ]; then
                echo "MAAP returned HTTP 202 for $workflow without a deployment-status URL" >&2
                return 1
              fi
              case "$deployment_url" in
                http://*|https://*) ;;
                /*) deployment_url="${MAAP_OGC_DEPLOYMENT_JOBS_URL%/deploymentJobs}$deployment_url" ;;
                *) deployment_url="$MAAP_OGC_DEPLOYMENT_JOBS_URL/$deployment_url" ;;
              esac
              deployment_urls["$workflow"]="$deployment_url"
            done

            while [ "${#pending_workflows[@]}" -gt 0 ]; do
              next_pending_workflows=()
              for workflow in "${pending_workflows[@]}"; do
                status_response="$responses/$(basename "$workflow").deployment-status.json"
                curl --fail-with-body --silent --show-error --output "$status_response" \
                  --header "proxy-ticket: $MAAP_TOKEN" \
                  "${deployment_urls[$workflow]}"
                deployment_status="$(jq --raw-output '
                  .status // .state // .deploymentStatus // .additionalProperties.status // empty
                ' "$status_response" | tr '[:upper:]' '[:lower:]')"

                case "$deployment_status" in
                  success|successful|succeeded|complete|completed|deployed)
                    printf 'MAAP deployment for %s succeeded: %s\n' "$workflow" "$deployment_status"
                    printf -- '- Deployment status: %s\n' "$deployment_status" >> "$GITHUB_STEP_SUMMARY"
                    ;;
                  failed|failure|error|dismissed|cancelled|canceled)
                    echo "MAAP deployment failed for $workflow: $deployment_status" >&2
                    return 1
                    ;;
                  *)
                    if [ "$SECONDS" -ge "$deadline" ]; then
                      echo "MAAP deployment timed out for $workflow; last status: ${deployment_status:-missing}" >&2
                      return 1
                    fi
                    printf 'MAAP deployment for %s is %s; polling again in 10 seconds\n' \
                      "$workflow" "${deployment_status:-unknown}"
                    next_pending_workflows+=("$workflow")
                    ;;
                esac
              done
              pending_workflows=("${next_pending_workflows[@]}")
              [ "${#pending_workflows[@]}" -eq 0 ] || sleep 10
            done
          }

          deploy() {
            local workflow="$1"
            local response="$responses/$(basename "$workflow").json"
            local headers="$responses/$(basename "$workflow").headers"
            local workflow_url="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$commit_sha/$workflow"
            local payload
            local process_id
            local status

            payload="{\"executionUnit\":{\"href\":\"$workflow_url\"}}"
            status="$(curl --silent --show-error --dump-header "$headers" --output "$response" --write-out '%{http_code}' \
              --request POST \
              --header "Content-Type: application/json" \
              --header "proxy-ticket: $MAAP_TOKEN" \
              --data "$payload" \
              "$MAAP_OGC_PROCESSES_URL")"

            if [ "$status" = "409" ]; then
              process_id="$(jq --exit-status --raw-output '.additionalProperties.processID' "$response")"
              status="$(curl --fail-with-body --silent --show-error --dump-header "$headers" --output "$response" --write-out '%{http_code}' \
                --request PUT \
                --header "Content-Type: application/json" \
                --header "proxy-ticket: $MAAP_TOKEN" \
                --data "$payload" \
                "$MAAP_OGC_PROCESSES_URL/$process_id")"
              log_response "$workflow" "updated" "$status" "$response"
            elif [ "$status" != "200" ] && [ "$status" != "201" ] && [ "$status" != "202" ]; then
              echo "MAAP registration failed for $workflow with HTTP $status" >&2
              return 1
            else
              log_response "$workflow" "registered" "$status" "$response"
            fi

            [ "$status" != "202" ] || pending_workflows+=("$workflow")
          }

          pending_workflows=()
          deploy dps/staged/esa-biomass-gamma0-staged.cwl
          deploy dps/fetch/esa-biomass-gamma0-fetch.cwl
          [ "${#pending_workflows[@]}" -eq 0 ] || monitor_deployments "${pending_workflows[@]}"
