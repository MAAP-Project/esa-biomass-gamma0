version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      all:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps):"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      all:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps):"
