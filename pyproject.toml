[project]
name = "esa-biomass-gamma0"
version = "0.1.0"
description = "DPS Algorithm for applying Gamma0 corrections to the Beta0 Biomass data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1.4",
    "h5netcdf>=1.8.1",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "mgrs>=1.5.4",
    "netcdf4>=1.7.4",
    "obstore>=0.11.0",
    "pystac>=1.15.2",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.0",
    "rioxarray>=0.23.0",
    "scipy>=1.18.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
]
