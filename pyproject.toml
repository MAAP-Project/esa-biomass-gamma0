[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "esa-biomass-gamma0"
version = "0.1.0"
description = "Create fixed-grid Gamma0 products from staged ESA BIOMASS L1B data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mgrs>=1.5.4",
    "netcdf4>=1.7.4",
    "pystac>=1.15.2",
    "rasterio>=1.5.0",
    "scipy>=1.18.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "obstore>=0.11.0",
    "pystac-client>=0.9.0",
    "pytest>=9.1.1",
    "requests>=2.32.5",
    "rioxarray>=0.23.0",
]
