[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "esa-biomass-gamma0"
version = "0.2.5"
description = "Create fixed-grid Gamma0 products from staged ESA BIOMASS L1B data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mgrs>=1.5.4",
    "netcdf4>=1.7.4",
    "packaging>=26.3",
    "pyproj>=3.7.2",
    "pystac>=1.15.2",
    "rasterio>=1.5.0",
    "scipy>=1.18.0",
    "typer>=0.27.1",
]

[project.scripts]
process-gamma0 = "esa_biomass_gamma0.cli:main"

[project.optional-dependencies]
fetch = [
    "maap-py>=5.1.0",
    "obstore>=0.11.0",
    "pystac-client>=0.9.0",
    "requests>=2.32.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-vv"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "boto3>=1.43.63",
    "jupyterlab>=4.6.2",
    "matplotlib>=3.11.1",
    "obstore>=0.11.0",
    "pre-commit>=4.6.0",
    "pystac-client>=0.9.0",
    "pytest>=9.1.1",
    "requests>=2.32.5",
    "rioxarray>=0.23.0",
    "ruff>=0.15.4",
    "shapely>=2.1.2",
]
docs = [
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.6",
]
